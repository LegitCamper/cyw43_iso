[package]
name = "cyw43-trouble-composition"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cyw43-iso-re = { path = "../..", default-features = false, features = ["lc3"] }
trouble_audio = { git = "https://github.com/LegitCamper/trouble_audio", rev = "a6a374c6c42997d46c6a7ad2badd9bef103afe11" }
trouble-host = { git = "https://github.com/LegitCamper/trouble", rev = "1f154caf2c4e1fb46bfcec0677c8545457c9b85b" }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
critical-section = { version = "1", features = ["std"] }

[patch.crates-io]
# Match trouble_audio's variable-length CIG return and CIS Test NSE fixes.
bt-hci = { git = "https://github.com/LegitCamper/bt-hci", rev = "a3b9b9785ef6e8269db31e1431f7d0710a6265cc" }
bt-hci-transport = { git = "https://github.com/LegitCamper/bt-hci", rev = "a3b9b9785ef6e8269db31e1431f7d0710a6265cc" }
